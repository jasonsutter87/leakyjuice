# Fly.io config for LeakyJuice. Deploys the Dockerfile (benchmark mode, egress-guarded).
# Add a front door before sharing widely:  fly secrets set FRONT_DOOR="ctf:yourpassword"
app = "leakyjuice-jsutter"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "4060"
  RESET_MINUTES = "30"   # auto-reseed so one player's mess doesn't spoil the next

[http_service]
  internal_port = 4060
  force_https = true
  auto_stop_machines = "stop"   # scale to zero when idle (free-tier friendly)
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
