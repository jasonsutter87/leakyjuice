document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

02Fspan>ce<\u002Fspan>\n    <\u002Fbutton>\n\n    <nav style=\"display:flex;gap:8px;align-items:center;margin-left:6px\">\n      <button sc-camel-on-click=\"{{ goStore }}\" style=\"border:0;background:none;border-radius:999px;padding:8px 15px;cursor:pointer;font-size:14.5px;font-weight:700;color:#4a423a\">Shop<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goAbout }}\" style=\"border:0;background:none;border-radius:999px;padding:8px 15px;cursor:pointer;font-size:14.5px;font-weight:700;color:#4a423a\">About us<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goAccount }}\" style=\"border:0;background:none;border-radius:999px;padding:8px 15px;cursor:pointer;font-size:14.5px;font-weight:700;color:#4a423a\">Account<\u002Fbutton>\n    <\u002Fnav>\n\n    <div style=\"flex:1\"><\u002Fdiv>\n\n    <button sc-camel-on-click=\"{{ goAuth }}\" style=\"border:2px solid #1d1a18;background:#fff;border-radius:999px;padding:8px 17px;cursor:pointer;font-size:14px;font-weight:700;box-shadow:0 2px 0 #1d1a18\">Sign in<\u002Fbutton>\n\n    <button sc-camel-on-click=\"{{ goCheckout }}\" style=\"border:2px solid #1d1a18;background:linear-gradient(#ffa04d,#ff6a13);color:#fff;border-radius:999px;padding:9px 18px;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px;box-shadow:0 2px 0 #1d1a18;text-shadow:0 1px 0 rgba(0,0,0,.25)\">\n      <span>Cart<\u002Fspan>\n      <span style=\"font-family:'Space Mono',monospace;font-weight:700;font-size:11.5px;background:#fff;color:#1d1a18;border-radius:999px;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;padding:0 5px;text-shadow:none\">{{ cartCount }}<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main style=\"flex:1\">\n\n<!-- ══ LANDING ══ -->\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n  <section style=\"border-bottom:2px solid #1d1a18;background:#ffe9cc\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:70px 26px 74px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:52px;align-items:center\">\n      <div>\n        <div style=\"display:inline-flex;align-items:center;gap:9px;border:2px solid #1d1a18;background:#fff;border-radius:999px;padding:6px 14px;margin-bottom:24px;box-shadow:0 2px 0 #1d1a18\">\n          <span style=\"width:8px;height:8px;border-radius:50%;background:#7fb800;display:block\"><\u002Fspan>\n          <span style=\"font-family:'Space Mono',monospace;font-size:11.5px;color:#4a423a\">running on localhost:3000<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(46px,5.4vw,76px);line-height:.98;letter-spacing:-.03em;margin:0 0 20px;text-wrap:balance\">Gadgets with plenty of <span style=\"color:#ff6a13\">juice<\u002Fspan>.<\u002Fh1>\n        <p style=\"font-size:18px;line-height:1.55;color:#4a423a;font-weight:600;max-width:42ch;margin:0 0 30px;text-wrap:pretty\">Speakers, power banks, smart plugs and one small drone. Free next-day shipping on everything over £25, no questions asked.<\u002Fp>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ goStore }}\" style=\"border:2px solid #1d1a18;background:linear-gradient(#ffa04d,#ff6a13);color:#fff;border-radius:999px;padding:16px 32px;cursor:pointer;font-size:16px;font-weight:800;box-shadow:0 3px 0 #1d1a18;text-shadow:0 1px 0 rgba(0,0,0,.25)\">Shop all gadgets<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ goAbout }}\" style=\"border:2px solid #1d1a18;background:#fff;border-radius:999px;padding:16px 30px;cursor:pointer;font-size:16px;font-weight:800;box-shadow:0 3px 0 #1d1a18\">What is this site?<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"aspect-ratio:1/1;border:2px solid #1d1a18;border-radius:22px;background:repeating-linear-gradient(135deg,#fff6e4 0 11px,#ffe6c6 11px 22px);box-shadow:0 4px 0 #1d1a18;display:flex;align-items:flex-end;padding:18px\">\n        <span style=\"font-family:'Space Mono',monospace;font-size:11.5px;color:#6a625a;background:#fff;border:2px solid #1d1a18;border-radius:8px;padding:6px 10px\">hero shot — speaker, earbuds and power bank on a bright ground<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1200px;margin:0 auto;padding:56px 26px 0\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:18px\">\n      <div style=\"background:#fff;border:2px solid #1d1a18;border-radius:18px;box-shadow:0 3px 0 #1d1a18;padding:26px\">\n        <div style=\"width:34px;height:34px;border-radius:10px;border:2px solid #1d1a18;background:#7fb800;margin-bottom:16px\"><\u002Fdiv>\n        <h3 style=\"font-family:'Baloo 2',cursive;font-weight:700;font-size:20px;margin:0 0 6px\">Next-day, free<\u002Fh3>\n        <p style=\"font-size:14.5px;line-height:1.5;color:#6a625a;margin:0;font-weight:600\">Order by 6pm. Tracking numbers arrive by email and increment by one.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:2px solid #1d1a18;border-radius:18px;box-shadow:0 3px 0 #1d1a18;padding:26px\">\n        <div style=\"width:34px;height:34px;border-radius:10px;border:2px solid #1d1a18;background:#1868f2;margin-bottom:16px\"><\u002Fdiv>\n        <h3 style=\"font-family:'Baloo 2',cursive;font-weight:700;font-size:20px;margin:0 0 6px\">Two-year cover<\u002Fh3>\n        <p style=\"font-size:14.5px;line-height:1.5;color:#6a625a;margin:0;font-weight:600\">Every gadget is covered. Claims are approved by whoever gets the request.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:2px solid #1d1a18;border-radius:18px;box-shadow:0 3px 0 #1d1a18;padding:26px\">\n        <div style=\"width:34px;height:34px;border-radius:10px;border:2px solid #1d1a18;background:#e01e5a;margin-bottom:16px\"><\u002Fdiv>\n        <h3 style=\"font-family:'Baloo 2',cursive;font-weight:700;font-size:20px;margin:0 0 6px\">Juice Points<\u002Fh3>\n        <p style=\"font-size:14.5px;line-height:1.5;color:#6a625a;margin:0;font-weight:600\">Ten points per pound spent. The balance lives in your account, client-side.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1200px;margin:0 auto;padding:60px 26px 0\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap\">\n      <h2 style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:42px;margin:0;letter-spacing:-.02em\">Popular this week<\u002Fh2>\n      <button sc-camel-on-click=\"{{ goStore }}\" style=\"border:2px solid #1d1a18;background:#fff;border-radius:999px;padding:10px 20px;cursor:pointer;font-size:14px;font-weight:700;box-shadow:0 2px 0 #1d1a18\">See all six →<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:20px\">\n      <sc-for list=\"{{ featured }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <div style=\"background:#fff;border:2px solid #1d1a18;border-radius:18px;box-shadow:0 3px 0 #1d1a18;overflow:hidden;display:flex;flex-direction:column\">\n          <button sc-camel-on-click=\"{{ p.onView }}\" style=\"border:0;border-bottom:2px solid #1d1a18;padding:0;cursor:pointer;display:block;aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#fff6e4 0 10px,#ffe6c6 10px 20px);position:relative\">\n            <span style=\"position:absolute;left:12px;bottom:12px;font-family:'Space Mono',monospace;font-size:10.5px;color:#6a625a;background:#fff;border:2px solid #1d1a18;border-radius:7px;padding:4px 8px\">{{ p.shot }}<\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"padding:18px;display:flex;flex-direction:column;gap:5px;flex:1\">\n            <div style=\"font-family:'Space Mono',monospace;font-size:10.5px;color:#a89e8d\">{{ p.category }}<\u002Fdiv>\n            <h3 style=\"font-family:'Baloo 2',cursive;font-weight:700;font-size:21px;margin:0;line-height:1.15\">{{ p.name }}<\u002Fh3>\n            <p style=\"font-size:13.5px;color:#6a625a;margin:0 0 12px;line-height:1.45;font-weight:600\">{{ p.blurb }}<\u002Fp>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n              <span style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:22px\">{{ p.priceLabel }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ p.onAdd }}\" style=\"border:2px solid #1d1a18;background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:13px;font-weight:700;box-shadow:0 2px 0 #1d1a18\">Add<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1200px;margin:0 auto;padding:62px 26px 84px\">\n    <div style=\"background:#1868f2;border:2px solid #1d1a18;border-radius:22px;box-shadow:0 4px 0 #1d1a18;padding:40px 44px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:36px;align-items:center\">\n      <div>\n        <h2 style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:34px;color:#fff;margin:0 0 8px;letter-spacing:-.02em\">Ten pounds off your first order<\u002Fh2>\n        <p style=\"font-size:16px;color:#d8e6ff;margin:0;font-weight:600\">Join the newsletter. Code arrives instantly and never expires.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n        <input placeholder=\"you@example.com\" style=\"border:2px solid #1d1a18;background:#fff;border-radius:999px;padding:13px 18px;font-size:15px;font-weight:600;min-width:220px\">\n        <button style=\"border:2px solid #1d1a18;background:#fff;border-radius:999px;padding:13px 24px;cursor:pointer;font-size:15px;font-weight:800;box-shadow:0 2px 0 #1d1a18\">Sign up<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ══ ABOUT ══ -->\n<sc-if value=\"{{ isAbout }}\">\n<div>\n  <section style=\"border-bottom:2px solid #1d1a18;background:#e8f7c8\">\n    <div style=\"max-width:900px;margin:0 auto;padding:64px 26px 68px\">\n      <div style=\"font-family:'Space Mono',monospace;font-size:11.5px;color:#4a423a;margin-bottom:18px\">ABOUT US<\u002Fdiv>\n      <h1 style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:62px;line-height:1;letter-spacing:-.03em;margin:0 0 22px;max-width:20ch\">We sell gadgets. We also leak, on purpose.<\u002Fh1>\n      <p style=\"font-size:19px;line-height:1.6;color:#3d372f;font-weight:600;margin:0;max-width:60ch;text-wrap:pretty\">LeakyJuIce is a practice target for people learning web security. It looks like a small electronics shop because that shape is useful: a catalogue, a login, a basket, a checkout, an order history, and a door round the back nobody linked to.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"max-width:900px;margin:0 auto;padding:56px 26px 90px\">\n    <p style=\"font-size:18px;line-height:1.65;color:#4a423a;font-weight:600;margin:0 0 44px;max-width:60ch;text-wrap:pretty\">Nothing here is a real product and no one is shipping anything. The speakers, the reviews, the loyalty scheme and the customer records are fiction. The vulnerabilities are not — every one of them was planted deliberately, and finding them is the point.<\u002Fp>\n\n    <div style=\"aspect-ratio:16/7;border:2px solid #1d1a18;border-radius:20px;background:repeating-linear-gradient(135deg,#fff6e4 0 11px,#ffe6c6 11px 22px);box-shadow:0 4px 0 #1d1a18;display:flex;align-items:flex-end;padding:18px;margin-bottom:52px\">\n      <span style=\"font-family:'Space Mono',monospace;font-size:11.5px;color:#6a625a;background:#fff;border:2px solid #1d1a18;border-radius:8px;padding:6px 10px\">team photo — five fictional people in a fictional warehouse<\u002Fspan>\n    <\u002Fdiv>\n\n    <h2 style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:36px;margin:0 0 20px;letter-spacing:-.02em\">House rules<\u002Fh2>\n    <div style=\"display:grid;gap:14px;margin-bottom:52px\">\n      <div style=\"background:#fff;border:2px solid #1d1a18;border-radius:18px;box-shadow:0 3px 0 #1d1a18;padding:24px 26px;display:grid;grid-template-columns:42px 1fr;gap:18px;align-items:start\">\n        <span style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:26px;color:#ff6a13;line-height:1\">01<\u002Fspan>\n        <div><h3 style=\"font-family:'Baloo 2',cursive;font-weight:700;font-size:21px;margin:0 0 5px\">Keep it on localhost<\u002Fh3><p style=\"font-size:15.5px;line-height:1.5;color:#6a625a;margin:0;font-weight:600\">Do not deploy this anywhere reachable, and never point these techniques at a system you have no permission to test.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:2px solid #1d1a18;border-radius:18px;box-shadow:0 3px 0 #1d1a18;padding:24px 26px;display:grid;grid-template-columns:42px 1fr;gap:18px;align-items:start\">\n        <span style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:26px;color:#7fb800;line-height:1\">02<\u002Fspan>\n        <div><h3 style=\"font-family:'Baloo 2',cursive;font-weight:700;font-size:21px;margin:0 0 5px\">Use throwaway credentials<\u002Fh3><p style=\"font-size:15.5px;line-height:1.5;color:#6a625a;margin:0;font-weight:600\">Passwords here are stored badly by design. Never reuse anything you care about.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:2px solid #1d1a18;border-radius:18px;box-shadow:0 3px 0 #1d1a18;padding:24px 26px;display:grid;grid-template-columns:42px 1fr;gap:18px;align-items:start\">\n        <span style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:26px;color:#1868f2;line-height:1\">03<\u002Fspan>\n        <div><h3 style=\"font-family:'Baloo 2',cursive;font-weight:700;font-size:21px;margin:0 0 5px\">Poke before you read<\u002Fh3><p style=\"font-size:15.5px;line-height:1.5;color:#6a625a;margin:0;font-weight:600\">There is a challenge list somewhere in this app. It is more fun if you find it late.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <h2 style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:36px;margin:0 0 20px;letter-spacing:-.02em\">What's planted inside<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:14px\">\n      <sc-for list=\"{{ classes }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <div style=\"background:#fff;border:2px solid #1d1a18;border-radius:16px;box-shadow:0 3px 0 #1d1a18;padding:20px\">\n          <div style=\"font-family:'Space Mono',monospace;font-weight:700;font-size:11px;color:#ff6a13;margin-bottom:8px\">{{ c.tag }}<\u002Fdiv>\n          <div style=\"font-family:'Baloo 2',cursive;font-weight:700;font-size:19px;line-height:1.2\">{{ c.name }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ══ AUTH ══ -->\n<sc-if value=\"{{ isAuth }}\">\n<div style=\"max-width:1200px;margin:0 auto;padding:60px 26px 96px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:60px;align-items:start\">\n  <div style=\"background:#fff;border:2px solid #1d1a18;border-radius:22px;box-shadow:0 4px 0 #1d1a18;padding:36px;max-width:470px\">\n    <div style=\"display:flex;gap:4px;background:#f4ecdb;border:2px solid #1d1a18;border-radius:999px;padding:4px;margin-bottom:28px\">\n      <button sc-camel-on-click=\"{{ setSignIn }}\" style=\"flex:1;border:0;border-radius:999px;padding:10px 0;cursor:pointer;font-size:14px;font-weight:800;background:{{ signInTabBg }};color:#1d1a18\">Sign in<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ setRegister }}\" style=\"flex:1;border:0;border-radius:999px;padding:10px 0;cursor:pointer;font-size:14px;font-weight:800;background:{{ registerTabBg }};color:#1d1a18\">Register<\u002Fbutton>\n    <\u002Fdiv>\n\n    <h1 style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:36px;margin:0 0 6px;letter-spacing:-.02em\">{{ authTitle }}<\u002Fh1>\n    <p style=\"font-size:15px;color:#6a625a;font-weight:600;margin:0 0 26px;line-height:1.5\">{{ authSub }}<\u002Fp>\n\n    <label style=\"display:block;font-size:13px;font-weight:700;color:#4a423a;margin-bottom:7px\">Email<\u002Flabel>\n    <input value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"you@example.com\" style=\"width:100%;border:2px solid #1d1a18;background:#fff;border-radius:11px;padding:12px 14px;font-size:15px;font-weight:600\">\n\n    <label style=\"display:block;font-size:13px;font-weight:700;color:#4a423a;margin:18px 0 7px\">Password<\u002Flabel>\n    <input type=\"password\" value=\"{{ password }}\" sc-camel-on-change=\"{{ onPassword }}\" placeholder=\"••••••••\" style=\"width:100%;border:2px solid #1d1a18;background:#fff;border-radius:11px;padding:12px 14px;font-size:15px;font-weight:600\">\n\n    <sc-if value=\"{{ isRegister }}\">\n      <div>\n        <label style=\"display:block;font-size:13px;font-weight:700;color:#4a423a;margin:18px 0 7px\">Security question<\u002Flabel>\n        <sc-raw-select style=\"width:100%;border:2px solid #1d1a18;background:#fff;border-radius:11px;padding:12px 14px;font-size:15px;font-weight:600;margin-bottom:12px\">\n          <option>Your first pet's name<\u002Foption>\n          <option>Your mother's maiden name<\u002Foption>\n          <option>Street you grew up on<\u002Foption>\n        <\u002Fsc-raw-select>\n        <input placeholder=\"Answer\" style=\"width:100%;border:2px solid #1d1a18;background:#fff;border-radius:11px;padding:12px 14px;font-size:15px;font-weight:600\">\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;margin:20px 0 22px\">\n      <label style=\"display:flex;align-items:center;gap:9px;font-size:14px;color:#6a625a;font-weight:600;cursor:pointer\">\n  0 rgba(0,0,0,.25)\">View order history<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ goStore }}\" style=\"border:2px solid #1d1a18;background:#fff;border-radius:999px;padding:14px 28px;cursor:pointer;font-size:15px;font-weight:800;box-shadow:0 3px 0 #1d1a18\">Keep shopping<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ══ SCOREBOARD (unlinked from main nav) ══ -->\n<sc-if value=\"{{ isScore }}\">\n<div style=\"max-width:1040px;margin:0 auto;padding:52px 26px 96px\">\n  <div style=\"font-family:'Space Mono',monospace;font-size:11.5px;color:#e01e5a;margin-bottom:14px\">/#/scoreboard · not linked from the shop<\u002Fdiv>\n  <h1 style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:54px;letter-spacing:-.03em;margin:0 0 10px;line-height:1\">Challenges<\u002Fh1>\n  <p style=\"font-size:16.5px;color:#5c554c;font-weight:600;margin:0 0 28px;max-width:56ch;line-height:1.55\">Each row names the class of flaw and where in the shop it lives. Working out the route is the exercise.<\u002Fp>\n  <div style=\"background:#fff;border:2px solid #1d1a18;border-radius:18px;box-shadow:0 3px 0 #1d1a18;overflow:hidden\">\n    <div style=\"background:#1d1a18;padding:13px 20px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) 96px 74px;gap:14px;font-family:'Space Mono',monospace;font-size:10.5px;color:#f4ecdb;letter-spacing:.05em\">\n      <span>CHALLENGE<\u002Fspan><span>SURFACE<\u002Fspan><span>DIFFICULTY<\u002Fspan><span>POINTS<\u002Fspan>\n    <\u002Fdiv>\n    <sc-for list=\"{{ challenges }}\" as=\"ch\" hint-placeholder-count=\"8\">\n      <div style=\"padding:15px 20px;border-bottom:2px solid #eee3d0;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) 96px 74px;gap:14px;align-items:center\">\n        <span style=\"font-size:14.5px;font-weight:700\">{{ ch.name }}<\u002Fspan>\n        <span style=\"font-size:13.5px;color:#6a625a;font-weight:600\">{{ ch.surface }}<\u002Fspan>\n        <span style=\"font-family:'Space Mono',monospace;font-size:12px;color:#ff6a13\">{{ ch.difficulty }}<\u002Fspan>\n        <span style=\"font-family:'Space Mono',monospace;font-size:12.5px\">{{ ch.points }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<footer style=\"border-top:2px solid #1d1a18;background:#fff\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:42px 26px;display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:30px\">\n    <div>\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px\">\n        <span style=\"width:20px;height:20px;border-radius:7px;border:2px solid #1d1a18;background:linear-gradient(#ffa04d,#ff6a13);display:block\"><\u002Fspan>\n        <span style=\"font-family:'Baloo 2',cursive;font-weight:800;font-size:22px\">LeakyJu<span style=\"color:#ff6a13\">I<\u002Fspan>ce<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:13.5px;line-height:1.55;color:#6a625a;font-weight:600;margin:0;max-width:34ch\">A deliberately insecure web application for security training. Not a real shop, not a real gadget.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:'Baloo 2',cursive;font-weight:700;font-size:17px;margin-bottom:10px\">Shop<\u002Fdiv>\n      <div style=\"display:grid;gap:8px;font-size:13.5px;font-weight:600;color:#6a625a;justify-items:start\"><button sc-camel-on-click=\"{{ goStore }}\" style=\"border:0;background:none;padding:0;cursor:pointer;font-size:13.5px;font-weight:600;color:#6a625a\">All gadgets<\u002Fbutton><span>Bundles<\u002Fspan><span>Gift cards<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:'Baloo 2',cursive;font-weight:700;font-size:17px;margin-bottom:10px\">Company<\u002Fdiv>\n      <div style=\"display:grid;gap:8px;font-size:13.5px;font-weight:600;color:#6a625a;justify-items:start\"><button sc-camel-on-click=\"{{ goAbout }}\" style=\"border:0;background:none;padding:0;cursor:pointer;font-size:13.5px;font-weight:600;color:#6a625a\">About us<\u002Fbutton><span>Press<\u002Fspan><span>Contact<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-family:'Baloo 2',cursive;font-weight:700;font-size:17px;margin-bottom:10px\">Help<\u002Fdiv>\n      <div style=\"display:grid;gap:8px;font-size:13.5px;font-weight:600;color:#6a625a;justify-items:start\"><button sc-camel-on-click=\"{{ goAuth }}\" style=\"border:0;background:none;padding:0;cursor:pointer;font-size:13.5px;font-weight:600;color:#6a625a\">Sign in<\u002Fbutton><span>Returns<\u002Fspan><span>Warranty<\u002Fspan><button sc-camel-on-click=\"{{ goScore }}\" style=\"border:0;background:none;padding:0;cursor:pointer;font-size:13.5px;font-weight:600;color:#6a625a\">Scoreboard<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 26px 34px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center\">\n    <span style=\"font-family:'Space Mono',monospace;font-size:11px;color:#a89e8d\">© 2026 LeakyJuIce · run on localhost only · no warranty, obviously<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showTestAccounts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Training mode&quot;},&quot;freeShippingThreshold&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:25,&quot;min&quot;:0,&quot;max&quot;:100,&quot;unit&quot;:&quot;£&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Store&quot;}}\">\nconst PRODUCTS = [\n  {id:1,name:\"OverFlow Bluetooth Speaker\",category:\"AUDIO\",price:39,blurb:\"14 hours of playback, IPX6, absurdly loud for its size.\",shot:\"compact speaker, three-quarter view\",long:\"A 40mm driver and a passive radiator in a body the size of a jam jar. Fourteen hours from a charge, water resistant to IPX6, and it pairs to two phones at once.\"},\n  {id:2,name:\"NullPointer Wireless Earbuds\",category:\"AUDIO\",price:59,blurb:\"Active noise cancelling with a case that charges by USB-C.\",shot:\"earbuds in open case\",long:\"Hybrid active noise cancelling, six hours per bud and twenty-four in the case. Transparency mode is a double-tap away, and the case takes USB-C.\"},\n  {id:3,name:\"RootAccess Smart Plug\",category:\"HOME\",price:19,blurb:\"Schedules, energy tracking, works with everything.\",shot:\"white smart plug, front view\",long:\"Thirteen amps, per-socket energy reporting, and schedules you can set from the app. Pairs over 2.4GHz and exposes a small local API for anyone who asks.\"},\n  {id:4,name:\"Payload Bank 20K\",category:\"POWER\",price:29,blurb:\"20,000mAh, 65W passthrough, two USB-C ports.\",shot:\"power bank with cable\",long:\"Twenty thousand milliamp-hours with 65W in and out, enough to charge a laptop and a phone at the same time. The display shows exact percentage rather than four vague bars.\"},\n  {id:5,name:\"ClearText Mechanical Keyboard\",category:\"INPUT\",price:45,blurb:\"65% layout, hot-swappable switches, no backlight.\",shot:\"65% keyboard, top-down\",long:\"Sixty-five percent layout with hot-swappable sockets so you can change switches without a soldering iron. Comes with tactile browns and a spare set of caps.\"},\n  {id:6,name:\"Sandbox Mini Drone\",category:\"HOME\",price:89,blurb:\"Palm-sized, 1080p camera, twelve-minute flights.\",shot:\"mini drone, props folded\",long:\"Folds to the size of a phone and flies for twelve minutes on a battery. The 1080p camera streams to your handset and stores clips to a card you supply.\"}\n];\n\nconst CHALLENGES = [\n  {name:\"Log in without a password\",surface:\"Auth form\",difficulty:\"★☆☆\",points:10},\n  {name:\"Read another customer's profile\",surface:\"Account page\",difficulty:\"★☆☆\",points:10},\n  {name:\"Reflect a script into search results\",surface:\"Shop search\",difficulty:\"★☆☆\",points:15},\n  {name:\"Store a payload in a product review\",surface:\"Product page\",difficulty:\"★★☆\",points:25},\n  {name:\"Pay less than the basket total\",surface:\"Checkout\",difficulty:\"★★☆\",points:25},\n  {name:\"Apply an expired discount code\",surface:\"Order summary\",difficulty:\"★★☆\",points:20},\n  {name:\"Download a receipt that isn't yours\",surface:\"Order history\",difficulty:\"★★☆\",points:25},\n  {name:\"Escalate a session to admin\",surface:\"Session token\",difficulty:\"★★★\",points:50},\n  {name:\"Retrieve the seeded user table\",surface:\"Auth form\",difficulty:\"★★★\",points:50},\n  {name:\"Read a file off the host\",surface:\"Profile photo URL\",difficulty:\"★★★\",points:60},\n  {name:\"Mint Juice Points\",surface:\"Loyalty balance\",difficulty:\"★★☆\",points:30},\n  {name:\"Find the unlinked admin panel\",surface:\"Routing\",difficulty:\"★☆☆\",points:15}\n];\n\nconst CLASSES = [\n  {tag:\"A03\",name:\"Injection\"},{tag:\"A01\",name:\"Broken access control\"},\n  {tag:\"A07\",name:\"Authentication failures\"},{tag:\"A04\",name:\"Insecure design\"},\n  {tag:\"A02\",name:\"Cryptographic failures\"},{tag:\"A08\",name:\"Integrity failures\"}\n];\n\nconst ORDERS = [\n  {id:\"LJ-40871\",items:\"RootAccess Smart Plug ×2\",total:\"£38.00\",status:\"Delivered\"},\n  {id:\"LJ-40712\",items:\"NullPointer Earbuds, Payload Bank 20K\",total:\"£88.00\",status:\"Delivered\"},\n  {id:\"LJ-40655\",items:\"ClearText Keyboard\",total:\"£45.00\",status:\"Delivered\"}\n];\n\nconst money = n => \"£\" + n.toFixed(2);\n\nclass Component extends DCLogic {\n  state = {\n    screen: \"home\", authMode: \"signin\", activeId: 1,\n    cart: {1:1, 3:2}, email: \"\", password: \"\", search: \"\", coupon: \"\"\n  };\n\n  go = s => () => { this.setState({screen:s}); window.scrollTo(0,0); };\n  add = id => () => this.setState(st => ({cart:{...st.cart,[id]:(st.cart[id]||0)+1}}));\n  bump = (id,d) => () => this.setState(st => {\n    const n = (st.cart[id]||0)+d, c = {...st.cart};\n    if (n<=0) delete c[id]; else c[id]=n;\n    return {cart:c};\n  });\n  drop = id => () => this.setState(st => { const c={...st.cart}; delete c[id]; return {cart:c}; });\n  view = id => () => { this.setState({screen:\"product\",activeId:id}); window.scrollTo(0,0); };\n\n  renderVals() {\n    const s = this.state.screen;\n    const q = this.state.search.trim().toLowerCase();\n    const visible = q ? PRODUCTS.filter(p => (p.name+\" \"+p.blurb+\" \"+p.category).toLowerCase().includes(q)) : PRODUCTS;\n    const decorate = p => ({...p, priceLabel: money(p.price), onAdd: this.add(p.id), onView: this.view(p.id)});\n\n    const cartItems = Object.keys(this.state.cart).map(k => {\n      const p = PRODUCTS.find(x => x.id === +k), qty = this.state.cart[k];\n      return {...p, qty, priceLabel: money(p.price), lineLabel: money(p.price*qty),\n        onInc: this.bump(p.id,1), onDec: this.bump(p.id,-1), onRemove: this.drop(p.id)};\n    });\n    const count = cartItems.reduce((a,c) => a+c.qty, 0);\n    const subtotal = cartItems.reduce((a,c) => a+c.price*c.qty, 0);\n    const threshold = this.props.freeShippingThreshold ?? 25;\n    const delivery = count && subtotal < threshold ? 3.95 : 0;\n    const tax = (subtotal+delivery)*0.2/1.2;\n    const total = subtotal+delivery;\n    const active = PRODUCTS.find(p => p.id === this.state.activeId) || PRODUCTS[0];\n    const reg = this.state.authMode === \"register\";\n\n    return {\n      isHome:s===\"home\", isAbout:s===\"about\", isAuth:s===\"auth\", isAccount:s===\"account\",\n      isStore:s===\"store\", isProduct:s===\"product\", isCheckout:s===\"checkout\",\n      isConfirm:s===\"confirm\", isScore:s===\"score\",\n\n      goHome:this.go(\"home\"), goAbout:this.go(\"about\"), goAuth:this.go(\"auth\"),\n      goAccount:this.go(\"account\"), goStore:this.go(\"store\"), goCheckout:this.go(\"checkout\"),\n      goScore:this.go(\"score\"),\n\n      products: visible.map(decorate),\n      featured: [PRODUCTS[0],PRODUCTS[1],PRODUCTS[3]].map(decorate),\n      challenges: CHALLENGES, classes: CLASSES, orders: ORDERS,\n\n      search: this.state.search,\n      onSearch: e => this.setState({search:e.target.value}),\n      coupon: this.state.coupon,\n      onCoupon: e => this.setState({coupon:e.target.value}),\n\n      email:this.state.email, password:this.state.password,\n      onEmail: e => this.setState({email:e.target.value}),\n      onPassword: e => this.setState({password:e.target.value}),\n      isRegister: reg,\n      signInTabBg: reg ? \"transparent\" : \"#fff\",\n      registerTabBg: reg ? \"#fff\" : \"transparent\",\n      authTitle: reg ? \"Create an account\" : \"Welcome back\",\n      authSub: reg ? \"Ten pounds off your first order, and Juice Points from day one.\" : \"Sign in to see your orders and Juice Points.\",\n      authCta: reg ? \"Create account\" : \"Sign in\",\n      setSignIn: () => this.setState({authMode:\"signin\"}),\n      setRegister: () => this.setState({authMode:\"register\"}),\n      doAuth: this.go(\"account\"),\n\n      activeName:active.name, activeCategory:active.category, activePrice:money(active.price),\n      activeLong:active.long, activeShot:active.shot, addActive:this.add(active.id),\n\n      cartItems, cartCount:count, cartEmpty:count===0, cartFilled:count>0,\n      showTestAccounts: this.props.showTestAccounts ?? true,\n      cartSummaryLine: count===0 ? \"Nothing in the basket yet.\" : count + (count===1?\" item\":\" items\") + \" · free next-day shipping over £\" + threshold,\n      subtotalLabel:money(subtotal), deliveryLabel: delivery ? money(delivery) : \"Free\",\n      taxLabel:money(tax), totalLabel:money(total),\n\n      placeOrder: () => { this.setState({screen:\"confirm\", cart:{}}); window.scrollTo(0,0); },\n      orderNumber:\"LJ-40912\", paidLabel:money(total)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
