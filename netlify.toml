# LeakyJuice — hosting-shell security headers.
#
# LeakyJuice is a deliberately-vulnerable, client-side CTF: the "leaks" are the
# product, and every exploit is sandboxed to the individual visitor's own browser
# tab (per-visitor Service Worker, in-memory SQLite with fake data, fresh
# per-session key, no network egress). These headers are defence-in-depth for the
# *shell* page ONLY — they stop it being framed or MIME-sniffed. They are
# intentionally NOT a script-restricting CSP, which would break the app and disarm
# the intended vuln lessons.
#
# Headers-only config (no [build] block) so it can't disturb the publish setup.

[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "frame-ancestors 'none'"

# The Service Worker is the app's whole backend — never let it go stale.
[[headers]]
  for = "/sw.js"

  [headers.values]
    Cache-Control = "no-cache"
