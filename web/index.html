<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LeakyJuice — Gadgets with plenty of juice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand" onclick="go('home')"><span class="dot"></span>LeakyJuice</div>
    <nav class="links">
      <a onclick="go('shop')">Shop</a>
      <a onclick="go('challenges')">Challenges</a>
      <a onclick="go('account')" id="nav-account">Account</a>
      <a class="pill" onclick="go('cart')">Basket<span class="cartcount" id="cartcount">0</span></a>
    </nav>
  </div>
</header>
<main id="app" class="wrap"><p class="muted" style="padding:40px 0">Starting the in-browser engine…</p></main>
<footer>
  LeakyJuice™ — we sell gadgets, we also leak, on purpose. · 100% in your browser · nothing phones home.
  · <a href="selfcheck.html">self-check</a>
</footer>
<script>
// Boot the WASM "server" (a Service Worker), then load the real frontend once it controls the page.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(async () => {
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) { location.reload(); return; } // first load: let the SW claim us
    for (const src of ['app.js', 'hack.js']) { const s = document.createElement('script'); s.src = src; document.body.appendChild(s); }
  }).catch((e) => { document.getElementById('app').innerHTML = '<p style="padding:40px 0;color:#d64545">Engine failed to start: ' + e.message + '</p>'; });
} else {
  document.getElementById('app').innerHTML = '<p style="padding:40px 0">This build needs a browser with Service Workers.</p>';
}
</script>
</body>
</html>
